name: FTC CI Build

on:
  push:
    branches: ["main", "master", "develop", "dev-stefan"]
  pull_request:
    branches: ["main", "master", "develop"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17" # Match your FTC SDK Java version (use 21 if using the newest SDK)
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :TeamCode:testDebugUnitTest

      - name: Run Python unit tests
        run: python3 -m unittest discover -s regressions -p 'test_*.py'

      - name: Build with Gradle
        run: ./gradlew build
