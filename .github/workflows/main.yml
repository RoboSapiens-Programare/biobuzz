name: Spotless Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  spotless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - run: chmod +x ./gradlew && ./gradlew spotlessCheck
